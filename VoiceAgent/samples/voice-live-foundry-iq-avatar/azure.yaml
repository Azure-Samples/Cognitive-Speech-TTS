# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: voice-live-foundry-iq-avatar
services:
  ai-project:
    host: azure.ai.project
  voice-live-foundry-iq-avatar:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - WebSocket Protocol
        - invocations_ws
        - Voice Live
        - Foundry IQ
        - Bring Your Own
        - Python
    project: src/voice-live-foundry-iq-avatar
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: voice-live-foundry-iq-avatar
    displayName: Voice Live — Foundry IQ
    description: A minimal real-time hosted agent that bridges invocations_ws directly to public Azure Voice Live and grounds standard-voice speech and text responses through a Foundry IQ knowledge-base MCP endpoint, with an experimental opt-in built-in Avatar.
    protocols:
      - protocol: invocations_ws
        version: 2.0.0
    env:
      AZURE_VOICELIVE_MODEL: ${AZURE_VOICELIVE_MODEL}
      AZURE_VOICELIVE_VOICE: ${AZURE_VOICELIVE_VOICE=en-US-Ava:DragonHDLatestNeural}
      AZURE_VOICELIVE_GREETING: "${AZURE_VOICELIVE_GREETING=Hello! I'm your AI knowledge assistant. How can I help you today?}"
      AZURE_VOICELIVE_ENABLE_AVATAR: ${AZURE_VOICELIVE_ENABLE_AVATAR=false}
      KB_MCP_ENDPOINT: ${KB_MCP_ENDPOINT:-}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
workflows:
  up:
    steps:
      - azd: provision
      - azd: deploy --all
hooks:
  postprovision:
    posix:
      shell: sh
      run: ./src/voice-live-foundry-iq-avatar/hooks/postprovision.sh
    windows:
      shell: pwsh
      run: ./src/voice-live-foundry-iq-avatar/hooks/postprovision.ps1
